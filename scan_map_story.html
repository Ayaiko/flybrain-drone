<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#ffffff;}
  svg{display:block;font-family:"Sukhumvit Set","Thonburi",sans-serif;}
</style></head>
<body>
<svg width="800" height="770" viewBox="0 0 800 770" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A978C"/>
    </marker>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#5B6470"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#8C949E" stroke-width="4"/>
    </pattern>
  </defs>
  <rect width="800" height="770" fill="#ffffff"/>

  <!-- grid 5x4, cell 140, origin (50,60) -->
  <rect x="50" y="60" width="700" height="560" fill="#F4F6F9"/>
  <rect x="610" y="60" width="140" height="140" fill="#D7F0EC"/>
  <rect x="50" y="480" width="140" height="140" fill="#E3ECF8"/>
  <!-- dead end (2,2) -->
  <rect x="330" y="340" width="140" height="140" fill="#F6DCCB"/>

  <!-- unknown internal edges -->
  <g stroke="#B8BEC6" stroke-width="2" stroke-dasharray="8 7">
    <line x1="190" y1="60" x2="190" y2="620"/>
    <line x1="330" y1="60" x2="330" y2="620"/>
    <line x1="470" y1="60" x2="470" y2="620"/>
    <line x1="610" y1="60" x2="610" y2="620"/>
    <line x1="50" y1="200" x2="750" y2="200"/>
    <line x1="50" y1="340" x2="750" y2="340"/>
    <line x1="50" y1="480" x2="750" y2="480"/>
  </g>
  <rect x="50" y="60" width="700" height="560" fill="none" stroke="#5B6470" stroke-width="5"/>

  <!-- scan area during try 1 (rows 2-3) -->
  <rect x="56" y="346" width="548" height="268" fill="#004AAD" fill-opacity="0.06"
        stroke="#004AAD" stroke-width="3" stroke-dasharray="14 8" rx="6"/>
  <text x="200" y="604" font-size="20" fill="#004AAD" font-weight="700">Scanned during try 1</text>

  <!-- walls mapped during try 1 -->
  <g stroke="#DC3A36" stroke-width="9" stroke-linecap="round">
    <line x1="330" y1="340" x2="330" y2="480"/>
    <line x1="470" y1="340" x2="470" y2="480"/>
    <line x1="190" y1="480" x2="610" y2="480"/>
  </g>

  <!-- trench between (3,3) and (4,3) -->
  <rect x="612" y="486" width="44" height="130" fill="url(#hatch)"/>
  <text x="703" y="530" font-size="20" fill="#333" text-anchor="middle">Trench</text>
  <text x="703" y="560" font-size="22" fill="#DC3A36" font-weight="700" text-anchor="middle">fell ×2</text>

  <!-- try 1: short route along row 3, fails at trench -->
  <polyline points="140,555 586,555" fill="none" stroke="#E8871E" stroke-width="9" stroke-dasharray="18 10" stroke-linecap="round"/>
  <g stroke="#DC3A36" stroke-width="8" stroke-linecap="round">
    <line x1="580" y1="535" x2="604" y2="559"/>
    <line x1="604" y1="535" x2="580" y2="559"/>
  </g>

  <!-- dead end label -->
  <text x="400" y="404" font-size="28" font-weight="700" fill="#9A4A1E" text-anchor="middle">Dead end</text>
  <text x="400" y="436" font-size="17" fill="#9A4A1E" text-anchor="middle">seen in try 1</text>

  <!-- try 2: new route up column 0, along row 1, up to goal -->
  <polyline points="105,530 105,262 680,262 680,168" fill="none" stroke="#1A978C" stroke-width="10"
            stroke-linejoin="round" marker-end="url(#ag)"/>
  <!-- skipped turn into dead end -->
  <line x1="400" y1="276" x2="400" y2="356" stroke="#DC3A36" stroke-width="5" stroke-dasharray="9 7"/>
  <g stroke="#DC3A36" stroke-width="7" stroke-linecap="round">
    <line x1="384" y1="300" x2="416" y2="332"/>
    <line x1="416" y1="300" x2="384" y2="332"/>
  </g>

  <!-- start / goal -->
  <circle cx="135" cy="555" r="22" fill="#004AAD"/>
  <circle cx="135" cy="555" r="22" fill="none" stroke="#fff" stroke-width="4"/>
  <text x="135" y="562" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">G1</text>
  <text x="122" y="508" font-size="20" font-weight="700" fill="#004AAD">START</text>
  <text x="680" y="118" font-size="30" font-weight="700" fill="#1A978C" text-anchor="middle">GOAL</text>

  <!-- step badges -->
  <g font-size="24" font-weight="700" text-anchor="middle">
    <circle cx="330" cy="522" r="20" fill="#E8871E"/><text x="330" y="530" fill="#fff">1</text>
    <circle cx="452" cy="362" r="20" fill="#DC3A36"/><text x="452" y="370" fill="#fff">2</text>
    <circle cx="250" cy="228" r="20" fill="#1A978C"/><text x="250" y="236" fill="#fff">3</text>
  </g>

  <!-- legend -->
  <g font-size="21" fill="#333">
    <line x1="60" y1="680" x2="110" y2="680" stroke="#E8871E" stroke-width="9" stroke-dasharray="14 8"/>
    <text x="124" y="688">Try 1: short route, fails</text>
    <line x1="420" y1="680" x2="470" y2="680" stroke="#1A978C" stroke-width="9"/>
    <text x="484" y="688">Try 2: new route to goal</text>
    <line x1="60" y1="730" x2="110" y2="730" stroke="#DC3A36" stroke-width="9" stroke-linecap="round"/>
    <text x="124" y="738">Wall mapped by scan</text>
    <rect x="427" y="712" width="36" height="36" fill="#F6DCCB"/>
    <text x="484" y="738">Dead end (3 walls)</text>
  </g>
</svg>
</body></html>
