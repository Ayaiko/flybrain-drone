<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#ffffff;}
  svg{display:block;font-family:"Sukhumvit Set","Thonburi",sans-serif;}
</style></head>
<body>
<svg width="800" height="770" viewBox="0 0 800 770" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A978C"/>
    </marker>
  </defs>
  <rect width="800" height="770" fill="#ffffff"/>

  <!-- grid: 5 cols x 4 rows, cell 140, origin (50,60) -->
  <!-- cell backgrounds -->
  <g fill="#F4F6F9">
    <rect x="50" y="60" width="700" height="560"/>
  </g>
  <!-- dead end cell (2,1) -->
  <rect x="330" y="200" width="140" height="140" fill="#F6DCCB"/>
  <!-- goal cell (4,0) -->
  <rect x="610" y="60" width="140" height="140" fill="#D7F0EC"/>

  <!-- unknown internal edges (gray dashed) -->
  <g stroke="#B8BEC6" stroke-width="2" stroke-dasharray="8 7">
    <line x1="190" y1="60" x2="190" y2="620"/>
    <line x1="330" y1="60" x2="330" y2="620"/>
    <line x1="470" y1="60" x2="470" y2="620"/>
    <line x1="610" y1="60" x2="610" y2="620"/>
    <line x1="50" y1="200" x2="750" y2="200"/>
    <line x1="50" y1="340" x2="750" y2="340"/>
    <line x1="50" y1="480" x2="750" y2="480"/>
  </g>
  <!-- outer border -->
  <rect x="50" y="60" width="700" height="560" fill="none" stroke="#5B6470" stroke-width="5"/>

  <!-- scan footprint around robot at (2,2): covers cols 1..3, rows 1..3 -->
  <rect x="190" y="200" width="420" height="420" fill="#004AAD" fill-opacity="0.06"
        stroke="#004AAD" stroke-width="3" stroke-dasharray="14 8" rx="6"/>
  <text x="202" y="606" font-size="24" fill="#004AAD" font-weight="700">Height-scan area</text>

  <!-- walls seen by scan (red) -->
  <g stroke="#DC3A36" stroke-width="9" stroke-linecap="round">
    <!-- dead end (2,1): left, right, top -->
    <line x1="330" y1="200" x2="330" y2="340"/>
    <line x1="470" y1="200" x2="470" y2="340"/>
    <line x1="330" y1="200" x2="470" y2="200"/>
    <!-- corridor row 2: top walls of (1,2) and (3,2) -->
    <line x1="190" y1="340" x2="330" y2="340"/>
    <line x1="470" y1="340" x2="610" y2="340"/>
    <!-- bottom of corridor -->
    <line x1="190" y1="480" x2="610" y2="480"/>
  </g>

  <!-- dead end label -->
  <text x="400" y="262" font-size="30" font-weight="700" fill="#9A4A1E" text-anchor="middle">Dead end</text>
  <text x="400" y="296" font-size="20" fill="#9A4A1E" text-anchor="middle">(3 walls)</text>

  <!-- rejected move into dead end -->
  <line x1="400" y1="388" x2="400" y2="318" stroke="#DC3A36" stroke-width="5" stroke-dasharray="9 7"/>
  <g stroke="#DC3A36" stroke-width="7" stroke-linecap="round">
    <line x1="384" y1="338" x2="416" y2="370"/>
    <line x1="416" y1="338" x2="384" y2="370"/>
  </g>

  <!-- traveled path -->
  <g fill="#7FA6D9">
    <circle cx="120" cy="410" r="7"/><circle cx="170" cy="410" r="7"/>
    <circle cx="220" cy="410" r="7"/><circle cx="270" cy="410" r="7"/><circle cx="320" cy="410" r="7"/>
  </g>
  <text x="62" y="455" font-size="20" fill="#5B6470">Path so far</text>

  <!-- chosen path to goal -->
  <polyline points="430,410 680,410 680,150" fill="none" stroke="#1A978C" stroke-width="10"
            stroke-linejoin="round" marker-end="url(#ag)"/>

  <!-- robot -->
  <circle cx="400" cy="410" r="26" fill="#004AAD"/>
  <circle cx="400" cy="410" r="26" fill="none" stroke="#ffffff" stroke-width="4"/>
  <text x="400" y="418" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">G1</text>

  <!-- goal -->
  <text x="680" y="118" font-size="30" font-weight="700" fill="#1A978C" text-anchor="middle">GOAL</text>

  <!-- step badges on diagram -->
  <g font-size="24" font-weight="700" text-anchor="middle">
    <circle cx="212" cy="222" r="20" fill="#004AAD"/><text x="212" y="230" fill="#fff">1</text>
    <circle cx="452" cy="222" r="20" fill="#DC3A36"/><text x="452" y="230" fill="#fff">2</text>
    <circle cx="710" cy="300" r="20" fill="#1A978C"/><text x="710" y="308" fill="#fff">3</text>
  </g>

  
  <!-- legend -->
  <g font-size="22" fill="#333">
    <line x1="60" y1="680" x2="110" y2="680" stroke="#DC3A36" stroke-width="9" stroke-linecap="round"/>
    <text x="124" y="688">Wall seen by scan</text>
    <line x1="420" y1="680" x2="470" y2="680" stroke="#B8BEC6" stroke-width="3" stroke-dasharray="8 7"/>
    <text x="484" y="688">Unknown (treated as open)</text>
    <rect x="68" y="712" width="36" height="36" fill="#F6DCCB"/>
    <text x="124" y="738">Dead end (3 walls)</text>
    <line x1="420" y1="730" x2="470" y2="730" stroke="#1A978C" stroke-width="9"/>
    <text x="484" y="738">Chosen path to goal</text>
  </g>
</svg>
</body></html>
