<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A978C"/>
    </marker>
    <g id="spike">
      <path d="M0,0 L7,-16 L14,0 z" fill="#E5484D" stroke="#B4232A" stroke-width="1"/>
    </g>
  </defs>
  <rect width="800" height="800" fill="#ffffff"/>

  <!-- 5x4 maze, cell 140 px (= 2 m), origin (50,60) -->
  <rect x="50" y="60" width="700" height="560" fill="#F4F6F9"/>
  <rect x="610" y="60" width="140" height="140" fill="#D7F0EC"/>
  <rect x="50" y="480" width="140" height="140" fill="#E3ECF8"/>
  <!-- dead-end cell D = (2,1) -->
  <rect x="330" y="200" width="140" height="140" fill="#F6DCCB"/>

  <!-- unknown internal edges -->
  <g stroke="#B8BEC6" stroke-width="2" stroke-dasharray="8 7">
    <line x1="190" y1="60" x2="190" y2="620"/>
    <line x1="330" y1="60" x2="330" y2="620"/>
    <line x1="470" y1="60" x2="470" y2="620"/>
    <line x1="610" y1="60" x2="610" y2="620"/>
    <line x1="50" y1="200" x2="750" y2="200"/>
    <line x1="50" y1="340" x2="750" y2="340"/>
    <line x1="50" y1="480" x2="750" y2="480"/>
  </g>
  <rect x="50" y="60" width="700" height="560" fill="none" stroke="#5B6470" stroke-width="5"/>

  <!-- walls mapped during try 1 (only where the robot got close) -->
  <g stroke="#DC3A36" stroke-width="9" stroke-linecap="round">
    <!-- D: left, top, right -->
    <line x1="330" y1="200" x2="330" y2="340"/>
    <line x1="330" y1="200" x2="470" y2="200"/>
    <line x1="470" y1="200" x2="470" y2="340"/>
    <!-- other walls next to the walked path -->
    <line x1="190" y1="480" x2="330" y2="480"/>
    <line x1="330" y1="340" x2="330" y2="480"/>
    <line x1="470" y1="480" x2="610" y2="480"/>
    <line x1="610" y1="200" x2="610" y2="480"/>
  </g>

  <!-- spike beds (alternating) in column 3 -->
  <g>
    <use href="#spike" x="572" y="332"/><use href="#spike" x="588" y="332"/>
    <use href="#spike" x="572" y="314"/><use href="#spike" x="588" y="314"/>
    <use href="#spike" x="482" y="262"/><use href="#spike" x="498" y="262"/>
    <use href="#spike" x="482" y="244"/><use href="#spike" x="498" y="244"/>
  </g>

  <!-- try 1: walks up toward D, sees its 3 walls up close, turns back, takes the spike corridor and falls -->
  <polyline points="140,555 400,555 400,395 540,395 540,262" fill="none" stroke="#E8871E" stroke-width="9"
            stroke-dasharray="18 10" stroke-linecap="round" stroke-linejoin="round"/>
  <g stroke="#DC3A36" stroke-width="8" stroke-linecap="round">
    <line x1="526" y1="236" x2="554" y2="264"/>
    <line x1="554" y1="236" x2="526" y2="264"/>
  </g>
  <text x="560" y="222" font-size="19" font-weight="700" fill="#DC3A36">fell</text>

  <!-- D label -->
  <text x="400" y="248" font-size="21" font-weight="700" fill="#9A4A1E" text-anchor="middle">Dead end</text>
  <text x="400" y="272" font-size="15" fill="#9A4A1E" text-anchor="middle">seen while</text>
  <text x="400" y="290" font-size="15" fill="#9A4A1E" text-anchor="middle">passing by</text>

  <!-- try 2: easy route up column 0, along row 0 -->
  <polyline points="105,530 105,128 596,128" fill="none" stroke="#1A978C" stroke-width="10"
            stroke-linejoin="round" marker-end="url(#ag)"/>

  <!-- start / goal / notes -->
  <circle cx="135" cy="555" r="22" fill="#004AAD" stroke="#ffffff" stroke-width="4"/>
  <text x="135" y="562" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">G1</text>
  <text x="122" y="508" font-size="19" font-weight="700" fill="#004AAD">START</text>
  <text x="680" y="140" font-size="28" font-weight="700" fill="#1A978C" text-anchor="middle">GOAL</text>
  <text x="200" y="292" font-size="16" fill="#5B6470" text-anchor="middle">never near</text>
  <text x="200" y="312" font-size="16" fill="#5B6470" text-anchor="middle">→ unknown</text>

  <!-- step badges -->
  <g font-size="22" font-weight="700" text-anchor="middle">
    <circle cx="262" cy="522" r="19" fill="#E8871E"/><text x="262" y="530" fill="#ffffff">1</text>
    <circle cx="330" cy="98" r="19" fill="#1A978C"/><text x="330" y="106" fill="#ffffff">2</text>
  </g>

  <!-- legend -->
  <g font-size="19" fill="#333333">
    <line x1="60" y1="670" x2="105" y2="670" stroke="#E8871E" stroke-width="9" stroke-dasharray="14 8"/>
    <text x="116" y="677">Try 1: hard route, falls</text>
    <line x1="430" y1="670" x2="475" y2="670" stroke="#1A978C" stroke-width="9"/>
    <text x="486" y="677">Try 2: easy route to goal</text>
    <line x1="430" y1="709" x2="475" y2="709" stroke="#DC3A36" stroke-width="9" stroke-linecap="round"/>
    <text x="486" y="716">Wall mapped (kept after reset)</text>
    <line x1="60" y1="709" x2="105" y2="709" stroke="#B8BEC6" stroke-width="3" stroke-dasharray="8 6"/>
    <text x="116" y="716">Unknown (never close)</text>
    <rect x="60" y="735" width="45" height="26" fill="#F6DCCB"/>
    <text x="116" y="755">Dead end (3 walls)</text>
  </g>
</svg>
